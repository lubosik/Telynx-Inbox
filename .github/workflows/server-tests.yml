name: Server tests

# The inbox went down on 20 August 2026 because routes/conversations.js passed
# every contact phone into a Supabase `.in()` filter. That serialises into the
# URL, and at 907 contacts it overflowed Node's HTTP header limit, so the query
# failed and every message preview came back null. No CI existed to catch it.
#
# test/no-unbounded-in.test.js now fails on that shape. This runs it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install

      # ── WHY THE TEST STEP NEEDS AN ENVIRONMENT ───────────────────────────
      #
      # Every one of the first 20 runs of this workflow FAILED, on the same
      # test, for the same reason, from the day it was added. `npm test`
      # includes test/server-boots.test.js, which requires server.js to prove
      # the deployed app would actually start. server.js reaches db.js, which
      # calls createClient(process.env.SUPABASE_URL, ...), and a runner with no
      # environment throws "supabaseUrl is required." before any code of ours
      # runs.
      #
      # The cost was not a red tick. Railway gates deploys on CI, so the gate
      # never opened: commits sat undeployed and reached production only
      # because somebody ran `railway redeploy` by hand. And a suite that is
      # permanently red cannot report anything — the outage this workflow was
      # written to catch, the unbounded `.in()` of 20 August, would have failed
      # into a run that was already failing and nobody would have looked.
      #
      # These values exist so that module-level construction succeeds. Nothing
      # here reaches a real service and no test in this suite makes a network
      # call. If a future test needs a real credential it wants a GitHub secret
      # and a skip when that secret is absent; it does not want one written
      # here.
      #
      # The VAPID pair is generated per run rather than committed. web-push
      # validates the key SHAPE at startup, so an obviously-fake string will
      # not do — and a valid-looking keypair sitting in a repository invites
      # somebody to wonder whether it is real. Generating it here means the
      # answer is visibly no.
      - name: Generate a throwaway VAPID keypair for this run
        run: |
          node -e "
            const { generateVAPIDKeys } = require('web-push');
            const { publicKey, privateKey } = generateVAPIDKeys();
            const out = require('node:fs');
            out.appendFileSync(process.env.GITHUB_ENV,
              'VAPID_PUBLIC_KEY=' + publicKey + '\n' +
              'VAPID_PRIVATE_KEY=' + privateKey + '\n');
          "

      - run: npm test
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: not-a-real-key-ci-only
          SESSION_SECRET: not-a-real-secret-ci-only-0000000000
          INBOX_PASSWORD: not-a-real-password-ci-only
          VAPID_SUBJECT: mailto:ci@example.invalid

      # public/app.js is a committed build artifact of public/app.jsx.
      #
      # This comment used to say "Nothing rebuilds it at deploy time". That is
      # false: railway.json sets buildCommand to `npm install && npm run build`,
      # so Railway DOES rebuild the bundle on every deploy. The check is still
      # worth having, for three reasons the old justification obscured:
      #
      #   1. The committed artifact is what any other consumer of this repo
      #      sees — a local `node server.js`, a clone, a code review, a rollback
      #      to a tagged commit, or a second deploy target that does not run a
      #      build step. A stale public/app.js means every one of those serves
      #      different code from production.
      #   2. It makes the diff honest. A reviewer reading a change to app.jsx
      #      can see the compiled consequence in the same commit instead of
      #      trusting that a build somewhere will produce what they expect.
      #   3. It catches a build that no longer reproduces: a Babel or preset
      #      version bump that changes the output fails here, at review time,
      #      rather than silently changing the shipped bundle on the next
      #      unrelated deploy.
      #
      # If railway.json's buildCommand is ever changed to skip `npm run build`,
      # this step becomes load-bearing for production too. Do not delete it.
      # It is the web-side counterpart of the generated-Xcode-project check in
      # .github/workflows/ios-build.yml.
      - name: Verify the browser bundle matches its source
        run: |
          npm run build
          git diff --exit-code -- public/app.js
